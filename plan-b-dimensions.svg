<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1650"><title>L型衣帽间 2000 家具定位图</title><style>text{font-family:Arial,"PingFang SC",sans-serif;fill:#304b3e}.dim{fill:none;stroke:#798976;stroke-width:1.1}</style><rect width="880" height="1650" fill="#fafaf5"/><text x="42" y="48" font-size="26" text-anchor="start">B / L型衣帽间 · 已确认定位</text><text x="42" y="80" font-size="17" text-anchor="start">3800 × 5500 mm ｜ 总进深2000 ｜ 次净衣900×550</text><rect x="200.0" y="150.0" width="456.0" height="660.0" fill="#f0ece2" stroke="#73806d" stroke-dasharray=""/><rect x="200.0" y="150.0" width="456.0" height="18.0" fill="#dce7e4" stroke="#73806d" stroke-dasharray=""/><rect x="200.0" y="150.0" width="24.0" height="72.0" fill="#8d9687" stroke="#73806d" stroke-dasharray=""/><text x="428.0" y="141.8" font-size="15" text-anchor="middle">唯一窗户 / 窗帘预留150</text><rect x="308.0" y="570.0" width="216.0" height="72.0" fill="#c6d0bb" stroke="#73806d" stroke-dasharray=""/><text x="416.0" y="611.0" font-size="15" text-anchor="middle">01 主柜1800</text><rect x="308.0" y="570.0" width="348.0" height="2.4" fill="#a58e6c" stroke="#73806d" stroke-dasharray=""/><rect x="524.0" y="570.0" width="132.0" height="72.0" fill="#ddcaaa" stroke="#73806d" stroke-dasharray=""/><rect x="602.0" y="642.0" width="54.0" height="60.0" fill="#ddcaaa" stroke="#73806d" stroke-dasharray=""/><text x="581.5999999999999" y="627.8" font-size="15" text-anchor="middle">05 梳妆台</text><text x="629.0" y="679.4" font-size="14" text-anchor="middle">06</text><rect x="524.0" y="570.0" width="132.0" height="42.0" fill="none" stroke="#657c70" stroke-dasharray="5 4"/><text x="590.0" y="599.0" font-size="13" text-anchor="middle">04 吊柜</text><rect x="590.0" y="702.0" width="66.0" height="108.0" fill="#c6b28f" stroke="#73806d" stroke-dasharray=""/><text x="623.0" y="752.6" font-size="20" text-anchor="middle">03</text><text x="623.0" y="779.0" font-size="11" text-anchor="middle">900×550</text><rect x="542.0" y="572.4" width="72.0" height="2.4" fill="#5dc4cd" stroke="#73806d" stroke-dasharray=""/><text x="578.0" y="559.4" font-size="13" text-anchor="middle">07 M2</text><rect x="392.0" y="807.6" width="72.0" height="2.4" fill="#5dc4cd" stroke="#73806d" stroke-dasharray=""/><text x="428.0" y="835.4" font-size="14" text-anchor="middle">11 M1 全身镜</text><circle cx="563.0" cy="684.0" r="27.0" fill="#a6b89b" stroke="#6a7868"/><text x="563.0" y="689.0" font-size="13" text-anchor="middle">08</text><rect x="314.0" y="318.0" width="228.0" height="252.0" fill="#bcaa8e" stroke="#73806d" stroke-dasharray=""/><rect x="320.0" y="324.0" width="216.0" height="240.0" fill="#e4e6d9" stroke="#73806d" stroke-dasharray=""/><rect x="332.0" y="505.2" width="78.0" height="50.4" fill="#fafaf5" stroke="#73806d" stroke-dasharray=""/><rect x="446.0" y="505.2" width="78.0" height="50.4" fill="#fafaf5" stroke="#73806d" stroke-dasharray=""/><text x="428.0" y="437.0" font-size="19" text-anchor="middle">09 / 10 床</text><path d="M200.0,810.0L200.0,705.0" stroke="#fafaf5" stroke-width="5"/><text x="35" y="790" font-size="13" text-anchor="start">原侧入口 ≈875</text><path d="M200.0,120.0L656.0,120.0" class="dim"/><path d="M196.0,116.0L204.0,124.0" class="dim"/><path d="M652.0,116.0L660.0,124.0" class="dim"/><text x="428.0" y="111.0" font-size="15" text-anchor="middle">3800</text><path d="M146.0,810.0L146.0,150.0" class="dim"/><path d="M142.0,806.0L150.0,814.0" class="dim"/><path d="M142.0,146.0L150.0,154.0" class="dim"/><text transform="translate(137.0 480.0) rotate(-90)" font-size="15" text-anchor="middle">5500</text><path d="M710.0,810.0L710.0,570.0" class="dim"/><path d="M706.0,806.0L714.0,814.0" class="dim"/><path d="M706.0,566.0L714.0,574.0" class="dim"/><text transform="translate(701.0 690.0) rotate(-90)" font-size="15" text-anchor="middle">衣帽区2000</text><path d="M710.0,570.0L710.0,150.0" class="dim"/><path d="M706.0,566.0L714.0,574.0" class="dim"/><path d="M706.0,146.0L714.0,154.0" class="dim"/><text transform="translate(701.0 360.0) rotate(-90)" font-size="15" text-anchor="middle">床区3500</text><path d="M422.0,810.0L422.0,642.0" class="dim"/><path d="M418.0,806.0L426.0,814.0" class="dim"/><path d="M418.0,638.0L426.0,646.0" class="dim"/><text transform="translate(413.0 726.0) rotate(-90)" font-size="15" text-anchor="middle">中央净深1400</text><path d="M428.0,318.0L428.0,168.0" class="dim"/><path d="M424.0,314.0L432.0,322.0" class="dim"/><path d="M424.0,164.0L432.0,172.0" class="dim"/><text transform="translate(419.0 243.0) rotate(-90)" font-size="15" text-anchor="middle">床尾1250</text><path d="M200.0,594.0L308.0,594.0" class="dim"/><path d="M196.0,590.0L204.0,598.0" class="dim"/><path d="M304.0,590.0L312.0,598.0" class="dim"/><text x="254.0" y="585.0" font-size="15" text-anchor="middle">侧通道900</text><path d="M200.0,414.0L314.0,414.0" class="dim"/><path d="M196.0,410.0L204.0,418.0" class="dim"/><path d="M310.0,410.0L318.0,418.0" class="dim"/><text x="257.0" y="405.0" font-size="15" text-anchor="middle">950</text><path d="M542.0,414.0L656.0,414.0" class="dim"/><path d="M538.0,410.0L546.0,418.0" class="dim"/><path d="M652.0,410.0L660.0,418.0" class="dim"/><text x="599.0" y="405.0" font-size="15" text-anchor="middle">950</text><text x="42" y="884" font-size="18" text-anchor="start">衣帽区：1400 + 600（含柜背）= 2000</text><text x="42" y="916" font-size="18" text-anchor="start">床尾：5500 − 2000 − 2100 − 150 = 1250</text><text x="42" y="947" font-size="15" text-anchor="start">M1在入口端墙朝换衣区；M2在柜背内侧，梳妆座位朝柜背。</text><text x="42" y="974" font-size="15" text-anchor="start">中央净深按柜门关闭计算；座位与抽屉开启会占用局部空间。</text><text x="42" y="1025" font-size="23" text-anchor="start">家具尺寸 / mm</text><text x="42" y="1070" font-size="16" text-anchor="start">01 主衣柜</text><text x="42" y="1097" font-size="17" text-anchor="start">1800 × 600 × 2400</text><text x="452" y="1070" font-size="16" text-anchor="start">02 柜背 / 床头背景</text><text x="452" y="1097" font-size="17" text-anchor="start">2900 × 20 × 2400</text><text x="42" y="1153" font-size="16" text-anchor="start">03 次净衣柜</text><text x="42" y="1180" font-size="17" text-anchor="start">900 × 550 × 2100</text><text x="452" y="1153" font-size="16" text-anchor="start">04 梳妆吊柜</text><text x="452" y="1180" font-size="17" text-anchor="start">1100 × 350 × 450</text><text x="42" y="1236" font-size="16" text-anchor="start">05 L形转角梳妆台</text><text x="42" y="1263" font-size="17" text-anchor="start">1100 × 1100 × 750</text><text x="452" y="1236" font-size="16" text-anchor="start">06 转角侧台下收纳</text><text x="452" y="1263" font-size="17" text-anchor="start">450 × 500 × 715</text><text x="42" y="1319" font-size="16" text-anchor="start">07 M2 梳妆镜</text><text x="42" y="1346" font-size="17" text-anchor="start">600 × 20 × 800</text><text x="452" y="1319" font-size="16" text-anchor="start">08 梳妆凳</text><text x="452" y="1346" font-size="17" text-anchor="start">Ø450 × 高450</text><text x="42" y="1402" font-size="16" text-anchor="start">09 床架</text><text x="42" y="1429" font-size="17" text-anchor="start">1900 × 2100 × 300</text><text x="452" y="1402" font-size="16" text-anchor="start">10 床垫</text><text x="452" y="1429" font-size="17" text-anchor="start">1800 × 2000 × 厚230</text><text x="42" y="1485" font-size="16" text-anchor="start">11 M1 全身镜</text><text x="42" y="1512" font-size="17" text-anchor="start">600 × 20 × 1800</text><text x="42" y="1595" font-size="15" text-anchor="start">主台1100×600＋侧台500×450；柜背计入600，不另加50。</text><text x="42" y="1625" font-size="15" text-anchor="start">概念尺寸，非施工图；结构、五金及完成面须复尺深化。</text></svg>